<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bologne</title>

  <link rel="stylesheet" href="../assets/css/galerie.css">
  <link rel="stylesheet" href="../assets/glightbox/glightbox.min.css">

  <script src="../assets/glightbox/glightbox.min.js"></script>
</head>

<body>

<h1>Torrechiara - 27 septembre</h1>

<p><a href="../index.html">← Retour à la carte</a></p>

<section class="gallery" id="gallery"></section>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const gallery = document.getElementById("gallery");
  const fragment = document.createDocumentFragment();

  const totalPhotos = 40;

  for (let i = 1; i <= totalPhotos; i++) {

    const fileName = `italie - ${i}.jpeg`;

    // Titre personnalisé selon le numéro de la photo
    
 let titre;

    if (i <6) {
      titre = "Repas au restaurant de la forteresse de Torrechiara";
    } else if (i <13) {
      titre = "Forteresse de Torrechiara";
    } else if (i <18) { 
      titre = "Forteresse de Torrechiara - La chambre d'or";  
    } else  if (i <20) { 
      titre = "Forteresse de Torrechiara - extérieur";  
    } else if (i <25) { 
      titre = "Forteresse de Torrechiara - salle de la chasse et de la pêche";  
    } else if (i <31) { 
      titre = "Forteresse de Torrechiara";  
    } else if (i <33) { 
      titre = " Ferves Ranger, une petite voiture tout-terrain de collection italienne produite entre 1966 et 1971";  
     } else {
      titre = "Ballade dans les vignes autour du chateau de Torrechiara";  
    } 

   
    
    

    

    

    const link = document.createElement("a");

    link.href = `../photo/photos0927/full/${fileName}`;
    link.className = "gallery-item glightbox";
    link.dataset.gallery = "Torrechiara";
    link.dataset.title = titre;
    link.dataset.description= "Torrechiara - 27 septembre";

    const img = document.createElement("img");

    img.src = `../photo/photos0927/mini/${fileName}`;
    img.alt = titre;
    img.loading = "lazy";

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.innerHTML = `<h3>${titre}</h3><p>Torrechiara - 27 septembre</p>`;

    link.appendChild(img);
    link.appendChild(caption);

    fragment.appendChild(link);
  }

  gallery.appendChild(fragment);

  GLightbox({
    selector: ".glightbox",
    loop: true
  });

});
</script>

<p><a href="../index.html">← Retour à la carte</a></p>

</body>
</html>
