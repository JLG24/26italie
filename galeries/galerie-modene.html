<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bologne</title>

  <link rel="stylesheet" href="../assets/css/galerie.css">
  <link rel="stylesheet" href="../assets/glightbox/glightbox.min.css">

  <script src="../assets/glightbox/glightbox.min.js"></script>
</head>

<body>

<h1>Modène- 28 septembre</h1>

<p><a href="../index.html">← Retour à la carte</a></p>

<section class="gallery" id="gallery"></section>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const gallery = document.getElementById("gallery");
  const fragment = document.createDocumentFragment();


  for (let i = 3; i <= 16; i++) {

    const fileName = `italie - ${i}.jpeg`;

    // Titre personnalisé selon le numéro de la photo
    
 let titre;

    if (i <4) {
      titre = "Capuccino";
    } else if (i <6) {
      titre = "Cathédrale de Modène";
    } else if (i <9) { 
      titre = " Palazzo Comunale de Modène";  
    } else  if (i <11) { 
      titre = "Modène";
     } else {
      titre = "Palazzo Ducale di Modena";  
    } 

   
    
    

    

    

    const link = document.createElement("a");

    link.href = `../photo/photos0928/full/${fileName}`;
    link.className = "gallery-item glightbox";
    link.dataset.gallery = "Torrechiara";
    link.dataset.title = titre;
    link.dataset.description= "Modène - 28 septembre";

    const img = document.createElement("img");

    img.src = `../photo/photos0928/mini/${fileName}`;
    img.alt = titre;
    img.loading = "lazy";

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.innerHTML = `<h3>${titre}</h3><p>Torrechiara - 27 septembre</p>`;

    link.appendChild(img);
    link.appendChild(caption);

    fragment.appendChild(link);
  }

  gallery.appendChild(fragment);

  GLightbox({
    selector: ".glightbox",
    loop: true
  });

});
</script>

<p><a href="../index.html">← Retour à la carte</a></p>

</body>
</html>
