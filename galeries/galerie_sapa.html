<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Hanoï 1</title>

  <link rel="stylesheet" href="../assets/css/galerie.css">
  <link rel="stylesheet" href="../assets/glightbox/glightbox.min.css">
  <script src="../assets/glightbox/glightbox.min.js"></script>
</head>

<body>

<h1>1<sup>er</sup> jour à Hanoï (19 avril)</h1> 

<p><a href="../index.html">← Retour à la carte</a></p>

<section class="gallery" id="gallery"></section>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const gallery = document.getElementById("gallery");
  const fragment = document.createDocumentFragment();
  const totalPhotos = 356; // Nombre total de photos dans la galerie



  




for (let i = 226; i <= totalPhotos; i++) {

  let fileName = `viet - ${i}.jpeg`;

  // 🎒 Définition du titre selon la séquence
  let titre;

  if (i <= 2) {
    titre = "";
  } else if (i <= 8) {
    titre = "";
  } else if (i <= 16) {
    titre = "";
  } else if (i <= 34) {
    titre = "";
  } else {
    titre = "";
  }

  const link = document.createElement("a");
  link.href = `../sapa0422/full/${fileName}`;
  link.className = "gallery-item glightbox";
  link.dataset.gallery = "sapa";
  link.dataset.title = titre;
  link.dataset.description = `Carnet de voyage — ${titre}`;

  const img = document.createElement("img");
  img.src = `../photo/sapa0422/mini${fileName}`;
  img.alt = titre;
  img.loading = "lazy";

  const caption = document.createElement("div");
  caption.className = "caption";
  caption.innerHTML = `<h3>${titre}</h3><p>Hanoï</p>`;

  link.appendChild(img);
  link.appendChild(caption);
  fragment.appendChild(link);
}




  gallery.appendChild(fragment);

  GLightbox({
    selector: '.glightbox',
    loop: true
  });

});
</script>

<p><a href="../index.html">← Retour à la carte</a></p>

</body>
</html>
