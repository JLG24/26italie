<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ravenne</title>

  <link rel="stylesheet" href="../assets/css/galerie.css">
  <link rel="stylesheet" href="../assets/glightbox/glightbox.min.css">

  <script src="../assets/glightbox/glightbox.min.js"></script>
</head>

<body>

<h1>Ravenne — 19 septembre</h1>

<p><a href="../index.html">← Retour à la carte</a></p>

<section class="gallery" id="gallery"></section>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const gallery = document.getElementById("gallery");
  const fragment = document.createDocumentFragment();

  const totalPhotos = 14;

  for (let i = 1; i <= totalPhotos; i++) {

    const fileName = `italie - ${i}.jpeg`;

    // Titre personnalisé selon le numéro de la photo
    let titre;

    if (i == 1) {
      titre = "L'immeuble de notre logement";
    } else if (i < 5) {
      titre = "Mausolée de Galla Placidia";
    } else if (i == 5) { 
      titre = "Premier capuccino ";  
     } else if (i < 10) {
        titre = "Cathédrale San Vitale";  
    }else if (i <13) {
      titre = "Batisterio Neoniano";  
    } else  {
      titre = "Basilique Sant'Apollinare Nuovo";  
    } 

    

    const link = document.createElement("a");

    link.href = `../photo/Ravenne/full/${fileName}`;
    link.className = "gallery-item glightbox";
    link.dataset.gallery = "Ravenne";
    link.dataset.title = titre;
    link.dataset.description = "Ravenne — 19 septembre";

    const img = document.createElement("img");

    img.src = `../photo/Ravenne/mini/${fileName}`;
    img.alt = titre;
    img.loading = "lazy";

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.innerHTML = `<h3>${titre}</h3><p>Ravenne — 19 septembre</p>`;

    link.appendChild(img);
    link.appendChild(caption);

    fragment.appendChild(link);
  }

  gallery.appendChild(fragment);

  GLightbox({
    selector: ".glightbox",
    loop: true
  });

});
</script>

<p><a href="../index.html">← Retour à la carte</a></p>

</body>
</html>
