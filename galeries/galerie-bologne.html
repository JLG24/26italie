<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bologne</title>

  <link rel="stylesheet" href="../assets/css/galerie.css">
  <link rel="stylesheet" href="../assets/glightbox/glightbox.min.css">

  <script src="../assets/glightbox/glightbox.min.js"></script>
</head>

<body>

<h1>Bologne — 26 septembre</h1>

<p><a href="../index.html">← Retour à la carte</a></p>

<section class="gallery" id="gallery"></section>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const gallery = document.getElementById("gallery");
  const fragment = document.createDocumentFragment();

  const totalPhotos = 27;

  for (let i = 1; i <= totalPhotos; i++) {

    const fileName = `italie - ${i}.jpeg`;

    // Titre personnalisé selon le numéro de la photo
    
 let titre;

    if (i == 1) {
      titre = "Cattedrale Metropolitana di San Pietro";
    } else if (i < 4) {
      titre = "Fontana del Nettuno";
    } else if (i <7) { 
      titre = "Pause déjeuner";  
    } else  {
      titre = "Déambulation dans les rues de Bologne";  
    } 

   
    
    

    

    

    const link = document.createElement("a");

    link.href = `../photo/photosBologne/full/${fileName}`;
    link.className = "gallery-item glightbox";
    link.dataset.gallery = "Bologne";
    link.dataset.title = titre;
    link.dataset.description= "Bologne - 26 septembre";

    const img = document.createElement("img");

    img.src = `../photo/photosBologne/mini/${fileName}`;
    img.alt = titre;
    img.loading = "lazy";

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.innerHTML = `<h3>${titre}</h3><p>Bologne - 26 septembre</p>`;

    link.appendChild(img);
    link.appendChild(caption);

    fragment.appendChild(link);
  }

  gallery.appendChild(fragment);

  GLightbox({
    selector: ".glightbox",
    loop: true
  });

});
</script>

<p><a href="../index.html">← Retour à la carte</a></p>

</body>
</html>
